<mat-form-field appearance="outline"
  class="input-field">
  <mat-label>{{ label() }}</mat-label>
  <input #input
    matInput
    [value]="localValue()"
    [disabled]="localDisabled()"
    [type]="inputType()"
    [placeholder]="placeholder()"
    (input)="onInputChange(input.value)"
  />
  <mat-icon matPrefix>search</mat-icon>
</mat-form-field>
