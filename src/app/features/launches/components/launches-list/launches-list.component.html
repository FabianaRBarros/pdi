<form [formGroup]="searchForm">
  <app-input class="search-field"
    label="Search for a mission..."
    inputType="text"
    placeholder="Ex. Crew-1"
    formControlName="term"></app-input>
</form>

@if (loading()) {
  <div class="launches-grid card-skeleton">
    @for (item of loadingArray; track item) {
      <app-loading-skeleton shape="rectangle"
        width="100%"
        height="170px"/>
    }
  </div>
} @else {
  @if (error()) {
    <app-empty-state [title]="error()?.message ?? 'Something went wrong'"
      iconName="error"/>
  } @else {
    <div class="launches-grid"
      infinite-scroll
      [infiniteScrollThrottle]="0"
      [infiniteScrollDistance]="1"
      (scrolled)="loadNextPage()">
      @for (launch of filteredLaunches(); track launch.flightNumber) {
        <app-launch-card class="launch-card"
          [launch]="launch"/>
      }
    </div>
  }
}
