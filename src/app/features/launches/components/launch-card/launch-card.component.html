<app-card
  [title]="launch().missionName"
  [subtitle]="'Flight n° ' + launch().flightNumber"
  [imageUrl]="launch().imageUrl ?? ''"
  [fallbackImageUrl]="launch().imageFallbackUrl"
  imageAlt="Mission's patch"
  [showImage]="true"
  [clickable]="true"
  (onClickCard)="goToDetails()">
  <p class="date-text">
    <app-icon class="date-icon"
      iconName="calendar_today"></app-icon>
    {{ launch().launchDate | date:'dd/MM/yyyy' }}
  </p>

  <app-chips-wrapper>
    <app-chip [type]="launch().success ? chipType.Success : chipType.Error">
      {{ launch().success ? 'Success' : 'Failure' }}
    </app-chip>
  </app-chips-wrapper>
</app-card>
